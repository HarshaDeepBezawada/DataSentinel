name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-typecheck:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy strict type checker
        run: |
          mypy datasentinel

      - name: Run pytest with coverage
        run: |
          pytest --cov=datasentinel --cov-report=xml --cov-report=term-missing --cov-fail-under=75

      - name: Build wheel and source distribution
        run: |
          pip install build
          python -m build
