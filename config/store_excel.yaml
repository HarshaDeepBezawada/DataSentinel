name: "Store Transactions Excel Pipeline"

source:
  type: "excel"
  name: "store_excel_source"
  options:
    path: "data/store_transactions.xlsx"
    sheet_name: 0

schema_baseline:
  fingerprint_path: ".datasentinel/schemas/store_transactions_baseline.json"
  auto_update: false

rules:
  - id: "RULE-TXN-001"
    type: "null_check"
    column: "transaction_id"
    description: "Transaction ID must not be null"
    severity: "error"
    params:
      allow_nulls: false

  - id: "RULE-TXN-002"
    type: "unique_check"
    column: "transaction_id"
    description: "Transaction ID must be unique"
    severity: "error"
    params:
      min_unique_rate: 1.0

  - id: "RULE-TXN-003"
    type: "regex"
    column: "store_id"
    description: "Store ID must conform to standard STR-XXX-00 format"
    severity: "error"
    params:
      pattern: "^STR-[A-Z]{3}-[0-9]{2}$"
      full_match: true

  - id: "RULE-TXN-004"
    type: "range"
    column: "amount"
    description: "Transaction amount must be between $0.01 and $10,000"
    severity: "error"
    params:
      min_value: 0.01
      max_value: 10000.00
      inclusive: true

  - id: "RULE-TXN-005"
    type: "foreign_key"
    column: "payment_type"
    description: "Payment type must be valid in-store tender"
    severity: "error"
    params:
      reference_values:
        - "card"
        - "cash"
        - "mobile"

anomaly_detection:
  enabled: true
  columns:
    - "amount"
    - "item_count"
  method: "both"
  zscore_threshold: 3.0
  iqr_multiplier: 1.5
  max_anomalies_to_report: 5
